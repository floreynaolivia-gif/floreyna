<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Aritmatika Sederhana</title>
</head>
<body>
    <style>
        body {
            font-family: 'Fredoka', cursive, sans-serif;
            background-color: #ffe6f0;
            background-image: radial-gradient(#ffb6c1 15%, transparent 16%), radial-gradient(#ffb6c1 15%, transparent 16%);
            background-size: 30px 30px;
            background-position: 0 0, 15px 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .card {
            background-color: #ffffff;
            padding: 25px 30px;
            border-radius: 25px;
            box-shadow: 0 10px 0px #ffb3d9, 0 15px 25px rgba(0, 0, 0, 0.1);
            border: 4px solid #ff80bf;
            width: 340px;
            text-align: center;
        }

        h2 {
            color: #ff4d94;
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 22px;
            text-shadow: 1px 1px 0px #ffccd5;
        }

        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0 10px;
        }

        td {
            color: #666;
            font-size: 14px;
            font-weight: 600;
            text-align: left;
        }

        input[type="text"] {
            width: 100%;
            padding: 10px;
            border: 3px solid #ffccd5;
            border-radius: 15px;
            box-sizing: border-box;
            font-family: 'Fredoka', cursive, sans-serif;
            font-size: 15px;
            text-align: center;
            outline: none;
            background-color: #fff0f5;
            color: #d63384;
            transition: all 0.2s;
        }

        input[type="text"]:focus {
            border-color: #ff66b2;
            background-color: #ffffff;
        }

        .btn-group {
            display: flex;
            gap: 8px;
            justify-content: space-between;
        }

        input[type="button"] {
            flex: 1;
            padding: 10px 0;
            background-color: #ff99cc;
            color: white;
            border: none;
            border-bottom: 4px solid #cc0066;
            border-radius: 12px;
            font-family: 'Fredoka', cursive, sans-serif;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.1s ease;
        }

        input[type="button"]:hover {
            background-color: #ff66b2;
            transform: translateY(-2px);
        }

        input[type="button"]:active {
            transform: translateY(3px);
            border-bottom-width: 1px;
        }

        .output-field {
            background-color: #e6ffe6 !important;
            border-color: #99ff99 !important;
            color: #2e8b57 !important;
            font-size: 18px !important;
            font-weight: bold;
        }

        .footer-text {
            font-size: 12px;
            color: #ff80bf;
            margin-top: 15px;
        }
    </style>
    <script>
        function proses(operator) {
            var bil1 = parseFloat(document.form1.bil1.value);
            var bil2 = parseFloat(document.form1.bil2.value);
            var hasil = 0;

            if (isNaN(bil1) || isNaN(bil2)) {
                alert("Isi dulu angkanya dong 🥺✨");
                return;
            }

            if (operator == '+') {
                hasil = bil1 + bil2;
            } else if (operator == '-') {
                hasil = bil1 - bil2;
            } else if (operator == '*') {
                hasil = bil1 * bil2;
            } else if (operator == '/') {
                if (bil2 == 0) {
                    alert("Tidak bisa dibagi nol yaa 🙈");
                    return;
                }
                hasil = bil1 / bil2;
            }

            document.form1.output.value = hasil;
        }
    </script>
</head>
<body>

    <div class="card">
        <h2>Hitung Ceria 🐾✨</h2>
        <form name="form1">
            <table>
                <tr>
                    <td width="42%">Angka 1 🌸</td>
                    <td><input type="text" name="bil1" placeholder="0"></td>
                </tr>
                <tr>
                    <td>Angka 2 🌺</td>
                    <td><input type="text" name="bil2" placeholder="0"></td>
                </tr>
                <tr>
                    <td>Operasi 🐱</td>
                    <td>
                        <div class="btn-group">
                            <input type="button" value="+" onclick="proses('+')">
                            <input type="button" value="-" onclick="proses('-')">
                            <input type="button" value="x" onclick="proses('*')">
                            <input type="button" value="/" onclick="proses('/')">
                        </div>
                    </td>
                </tr>
                <tr>
                    <td>Hasil 🎉</td>
                    <td><input type="text" name="output" class="output-field" readonly placeholder="= 0"></td>
                </tr>
            </table>
        </form>
        <div class="footer-text">✨ Belajar JavaScript Jadi Seru ✨</div>
    </div>
</body>
</html>
