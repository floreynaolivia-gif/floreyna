<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tugas 2</title>
    <link rel="stylesheet" type="text/css" href="form.css">
</head>
<body>
   <h2>Form Pendaftaran Mahasiswa</h2>

    <form method="POST" action="#">
        <fieldset>
            <legend>Data Pendaftaran</legend>

            <!-- 1. Nama Lengkap (Emoji 👤) -->
            <label><b>Nama Lengkap:</b></label>
            <ol class="list-nama">
                <li><input type="text" id="nama" name="nama" placeholder="Masukkan nama" required></li>
            </ol>

            <!-- 2. Password (Emoji 🔒) -->
            <label><b>Password:</b></label>
            <ol class="list-password">
                <li><input type="password" id="sandi" name="sandi" placeholder="Masukkan password" required></li>
            </ol>

            <!-- Program Studi (Select Standard) -->
            <label for="jurusan"><b>Program Studi:</b></label><br>
            <select id="jurusan" name="jurusan">
                <option value="ft">S1 Teknik Sipil</option>
                <option value="ilkom">S1 Ilmu Komputer</option>
                <option value="ti">S1 Teknologi Informasi</option>
            </select><br><br>

            <!-- 3. Jenis Kelamin (Emoji 🚻) -->
            <label><b>Jenis Kelamin:</b></label>
            <ol class="list-jk">
                <li>
                    <input type="radio" id="pria" name="jk" value="Pria">
                    <label for="pria">Pria</label>
                </li>
                <li>
                    <input type="radio" id="wanita" name="jk" value="Perempuan">
                    <label for="wanita">Perempuan</label>
                </li>
            </ol>

            <!-- 4. Informasi Yang Disukai (Emoji ⭐) -->
            <label><b>Informasi Yang Disukai:</b></label>
            <ol class="list-info">
                <li>
                    <input type="checkbox" id="olahraga" name="hobi" value="Olahraga">
                    <label for="olahraga">Olahraga</label>
                </li>
                <li>
                    <input type="checkbox" id="travelling" name="hobi" value="Travelling">
                    <label for="travelling">Travelling</label>
                </li>
                <li>
                    <input type="checkbox" id="menonton film" name="hobi" value="Menonton Film">
                    <label for="menonton film">Menonton Film</label>
                </li>
            </ol>

            <!-- 5. Alamat Rumah (Emoji 🏠) -->
            <label><b>Alamat Rumah:</b></label>
            <ol class="list-alamat">
                <li><textarea id="alamat" name="alamat" rows="3" placeholder="Masukkan alamat lengkap"></textarea></li>
            </ol>

            <!-- Tombol Aksi -->
            <input type="submit" value="Daftar">
            <input type="reset" value="Reset">
        </fieldset>
    </form>

    <br>
    <a href="index.html">← Kembali ke Halaman Utama</a>

</body>
</html>
</body>
</html>
